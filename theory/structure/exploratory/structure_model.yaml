time_units: generations
demes:
- name: popA 
  epochs:
  - {end_time: 12000, start_size: 10000}    
- name: stem1 
  ancestors: [popA]
  epochs:
  - {end_time: 2000, start_size: 5000}      
- name: stem2 
  ancestors: [popA]
  epochs:
  - {end_time: 2000, start_size: 5000}    
- name: popX 
  start_time: 2000
  ancestors: [stem1, stem2]
  proportions: [0.5, 0.5]
  epochs:
  - {end_time: 0, start_size: 10000}     
