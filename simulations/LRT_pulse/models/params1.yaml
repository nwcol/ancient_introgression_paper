parameters: 
- name: N_A
  lower_bound: 10
  upper_bound: 1e5
  values: 
    - demes: 
        A: 
          epochs: 
            0: start_size
- name: T_XY
  lower_bound: 10
  upper_bound: 1e5
  values: 
    - demes: 
        A: 
          epochs: 
            0: end_time
- name: N_X
  lower_bound: 10
  upper_bound: 1e5
  values: 
    - demes: 
        popX: 
          epochs: 
            0: start_size
- name: N_Y
  lower_bound: 10
  upper_bound: 1e5
  values: 
    - demes: 
        popY: 
          epochs: 
            0: start_size

- name: T_X_Y
  lower_bound: 100
  upper_bound: 1e4
  values: 
    - pulses: 
        0: time
- name: p_X_Y
  lower_bound: 0.001
  upper_bound: 0.2
  values: 
    - pulses: 
        0:  
          proportions: 0
constraints:
- params: [T_XY, T_X_Y]
  constraint: greater_than
