parameters: 

# T parameters
- name: T_NDH
  upper_bound: 2e6
  values: 
    - demes: 
        Anc: 
          epochs: 
            0: end_time 

- name: T_ND
  description: Divergence time of Neanderthal and Denisova lineages
  lower_bound: 2.5e5
  values: 
    - demes: 
        ND: 
          epochs: 
            0: end_time

- name: T_AWN
  lower_bound: 115000
  upper_bound: 250000
  values: 
    - demes: 
        N: 
          epochs: 
            0: end_time 

- name: T_CV
  lower_bound: 55000
  upper_bound: 1.1e5
  values: 
    - demes: 
        WN: 
          epochs: 
            0: end_time 

- name: T_OOA 
  description: Divergence time of Yoruba and Loschbour/OOA
  lower_bound: 50000
  upper_bound: 1.1e5
  values: 
    - demes: 
        MH: 
          epochs: 
            0: end_time 

- name: T_SL
  description: Divergence time of Stuttgart/Basal Eurasian and Loschbour demes
  values: 
    - demes: 
        Loschbour: 
          epochs: 
            0: end_time 
        Stuttgart: start_time

- name: T_L_S
  lower_bound: 1e4
  values: 
    - pulses: 
        3: time

## Effective size parameters
- name: N_Anc 
  lower_bound: 1e4
  upper_bound: 3e4
  values: 
    - demes: 
        Anc: 
          epochs: 
            0: start_size

- name: N_ND
  lower_bound: 100
  upper_bound: 1e5
  values: 
    - demes: 
        ND: 
          epochs: 
            0: start_size 

- name: N_Den
  lower_bound: 1e3
  upper_bound: 1e4
  values: 
    - demes: 
        Denisova: 
          epochs: 
            0: start_size 

- name: N_N
  lower_bound: 100
  upper_bound: 1e4
  values: 
    - demes: 
        N: 
          epochs: 
            0: start_size 
        WN: 
          epochs: 
            0: start_size 

- name: N_Chag
  lower_bound: 10
  upper_bound: 1e4
  values: 
    - demes: 
        Chagyrskaya: 
          epochs: 
            0: start_size 

- name: N_Vin
  lower_bound: 10
  upper_bound: 1e4
  values: 
    - demes: 
        Vindija: 
          epochs: 
            0: start_size 

- name: N_Alt
  lower_bound: 10
  upper_bound: 1e4
  values: 
    - demes: 
        Altai: 
          epochs: 
            0: start_size 

- name: N_MH
  lower_bound: 100
  upper_bound: 1e5
  values: 
    - demes: 
        MH: 
          epochs: 
            0: start_size 

- name: N_Yor
  lower_bound: 100
  upper_bound: 1e6
  values: 
    - demes: 
        Yoruba1: 
          epochs: 
            0: start_size 

- name: N_OOA
  lower_bound: 10
  upper_bound: 1e4
  values: 
    - demes: 
        Loschbour: 
          epochs: 
            0: start_size 

- name: N_Los
  lower_bound: 100
  upper_bound: 1e5
  values: 
    - demes: 
        Loschbour: 
          epochs: 
            1: start_size 

- name: N_Stut
  lower_bound: 100
  upper_bound: 1e5
  values: 
    - demes: 
        Stuttgart: 
          epochs: 
            0: start_size 

- name: N_Ust
  lower_bound: 10
  upper_bound: 1e5
  values: 
    - demes: 
        UstIshim: 
          epochs: 
            0: start_size 

# m parameters

- name: m_ND
  lower_bound: 1e-8
  upper_bound: 1e-2
  values: 
    - migrations: 
        0: rate
        1: rate

- name: m_LY
  lower_bound: 1e-8
  upper_bound: 1e-2
  values: 
    - migrations: 
        2: rate

# p parameters

- name: p_H_N
  lower_bound: 1e-10
  upper_bound: 0.999
  values: 
    - pulses: 
        0: 
          proportions: 0 

- name: p_H_WN
  lower_bound: 1e-10
  upper_bound: 0.999
  values: 
    - pulses: 
        1: 
          proportions: 0 

- name: p_N_OOA
  lower_bound: 1e-10
  upper_bound: 0.999
  values: 
    - pulses: 
        2: 
          proportions: 0 

- name: p_L_S
  description: Fraction of Western Eurasian contribution to Stuttgart lineage
  lower_bound: 1e-10
  upper_bound: 0.999
  values: 
    - pulses: 
        3: 
          proportions: 0 

constraints: 
- params: [T_NDH, T_ND]
  constraint: greater_than
- params: [T_OOA, T_SL]
  constraint: greater_than
- params: [T_SL, T_L_S]
  constraint: greater_than