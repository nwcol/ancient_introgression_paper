# m parameters
- name: m_AD
  description: migration rate between Neanderthal stem/Altai and Denisovans
  lower_bound: 1e-8
  upper_bound: 1e-2
  values:
    - migrations: 
        0: rate
        1: rate

- name: m_YL
  description: migration rate between Yoruba and Loschbour
  lower_bound: 1e-8
  upper_bound: 1e-2
  values:
    - migrations: 
        2: rate

# p parameters
- name: p_V_L
  description: pulse proportion from Vindija to Loschbour
  lower_bound: 1e-6
  upper_bound: 1e-1
  values: 
    - pulses: 
        0: 
          proportions: 0
  
constraints: 
- params: [T_NDH, T_ND]
  constraint: greater_than
- params: [T_ND, T_AN]
  constraint: greater_than
- params: [T_AN, T_CV]
  constraint: greater_than
