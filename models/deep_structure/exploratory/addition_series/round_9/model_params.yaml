parameters:
# Time parameters
- name: T_OOA
  upper_bound: 1e5
  lower_bound: 5e4
  values: 
    - demes: 
        Loschbour: start_time

- name: T_LosExp
  lower_bound: 1e4
  values: 
    - demes: 
        Loschbour: 
          epochs: 
            0: end_time

# Size parameters

- name: N_OOA
  lower_bound: 100
  upper_bound: 1e4
  values: 
    - demes: 
        Loschbour: 
          epochs: 
            0: start_size

- name: N_Los
  lower_bound: 100
  upper_bound: 1e4
  values: 
    - demes: 
        Loschbour: 
          epochs: 
            1: start_size

- name: N_Yor
  lower_bound: 1e3
  upper_bound: 1e6
  values: 
    - demes: 
        Yoruba1: 
          epochs: 
            0: start_size

- name: m_LY
  lower_bound: 1e-8
  upper_bound: 1e-2
  values: 
    - migrations: 
        3: rate
          
constraints:
- params: [T_OOA, T_LosExp]
  constraint: greater_than