parameters:
# Time parameters
- name: T_Stem
  upper_bound: 2e6
  values: 
    - demes: 
        Stem: start_time

- name: T_NDMH
  upper_bound: 1e6
  lower_bound: 400000
  values: 
    - demes: 
        Anc: 
          epochs: 
            0: end_time

- name: T_KY
  upper_bound: 3e5
  lower_bound: 1e4
  values: 
    - demes: 
        MH: 
          epochs: 
            0: end_time
        Stem: 
          epochs: 
            0: end_time
        KhomaniSan1: start_time 
        Yoruba1: start_time

# Size parameters

- name: N_Anc
  lower_bound: 1e4
  upper_bound: 2e4
  values: 
    - demes: 
        Anc: 
          epochs: 
            0: start_size

- name: N_Stem
  lower_bound: 4e3
  upper_bound: 5e4
  values: 
    - demes: 
        Stem: 
          epochs: 
            0: start_size

- name: N_MH
  lower_bound: 1e4
  upper_bound: 1e6
  values: 
    - demes: 
        MH: 
          epochs: 
            0: start_size

- name: N_Yor
  lower_bound: 1e3
  upper_bound: 1e6
  values: 
    - demes: 
        Yoruba1: 
          epochs: 
            0: start_size

- name: N_Kho
  lower_bound: 1e3
  upper_bound: 1e6
  values: 
    - demes: 
        KhomaniSan1: 
          epochs: 
            0: start_size
- name: N_KhoBot
  lower_bound: 10
  upper_bound: 1e4
  values: 
    - demes: 
        KhomaniSan1: 
          epochs: 
