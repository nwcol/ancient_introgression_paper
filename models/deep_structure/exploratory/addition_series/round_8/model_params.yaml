- name: N_Den
  lower_bound: 10
  upper_bound: 1e4
  values: 
    - demes: 
        Denisova: 
          epochs: 
            0: start_size

# Pulse proportions and migrations 

- name: p_StemK
  lower_bound: 1e-4
  upper_bound: 0.95
  values: 
    - demes: 
        KhomaniSan1:
          proportions: 0

- name: p_StemY
  lower_bound: 1e-4
  upper_bound: 0.95
  values: 
    - demes: 
        Yoruba1:
          proportions: 0

- name: m_Stems
  lower_bound: 1e-8
  upper_bound: 1e-2
  values: 
    - migrations: 
        0: rate
        1: rate

- name: m_KY
  lower_bound: 1e-8
  upper_bound: 1e-2
  values: 
    - migrations: 
        2: rate
          
constraints:
- params: [T_Stem, T_NDMH]
  constraint: greater_than