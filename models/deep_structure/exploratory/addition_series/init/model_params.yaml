parameters:
# Time parameters
- name: T_NDMH
  upper_bound: 1e6
  lower_bound: 400000
  values: 
    - demes: 
        Anc: 
          epochs: 
            0: end_time

- name: T_pulse
  upper_bound: 1e6
  lower_bound: 1e5
  values: 
    - demes: 
        Sup:
          epochs: 
            0: end_time
    - pulses: 
        0: time

# Size parameters

- name: N_Anc
  lower_bound: 1e4
  upper_bound: 2e4
  values: 
    - demes: 
        Anc: 
          epochs: 
            0: start_size

- name: N_MH
  lower_bound: 1e4
  upper_bound: 1e6
  values: 
    - demes: 
        Yoruba1: 
          epochs: 
            0: start_size

- name: N_Den
  lower_bound: 10
  upper_bound: 1e4
  values: 
    - demes: 
        Denisova: 
          epochs: 
            0: start_size


# Pulse proportions and migrations 

- name: p_S_D
  lower_bound: 1e-6
  upper_bound: 0.15
  values: 
    - pulses: 
        0:
          proportions: 0
          
constraints: 
- params: [T_NDMH, T_pulse]
  constraint: greater_than
