parameters:
# Time parameters
- name: T_Stem
  upper_bound: 2e6
  values: 
    - demes: 
        Stem: start_time

- name: T_NDMH
  upper_bound: 2e6
  lower_bound: 400000
  values: 
    - demes: 
        Anc: 
          epochs: 
            0: end_time

- name: T_D
  upper_bound: 6.5e5
  lower_bound: 1e5
  values: 
    - demes: 
        D: start_time

- name: T_OOA
  upper_bound: 2e5
  lower_bound: 1e4
  values: 
    - demes: 
        MH: 
          epochs: 
            0: end_time
        Stem: 
          epochs: 
            0: end_time
        Yoruba1: start_time 
        Stuttgart: start_time

# Size parameters

- name: N_Anc
  lower_bound: 1e4
  upper_bound: 2e4
  values: 
    - demes: 
        Anc: 
          epochs: 
            0: start_size

- name: N_MH
  lower_bound: 1e3
  upper_bound: 1e6
  values: 
    - demes: 
        MH: 
          epochs: 
            0: start_size

- name: N_Stu
  lower_bound: 100
  upper_bound: 1e6
  values: 
    - demes: 
        Stuttgart: 
          epochs: 
            0: start_size

- name: N_Yor
  lower_bound: 100
  upper_bound: 1e6
  values: 
    - demes: 
        Yoruba1: 
          epochs: 
            0: start_size

- name: N_Den
  lower_bound: 10
  upper_bound: 1e4
  values: 
    - demes: 
        Denisova: 
          epochs: 
            0: start_size
        D: 
          epochs: 
            0: start_size

# Pulse proportions and migrations 

- name: m_DD
  lower_bound: 1e-8
  upper_bound: 1e-2
  values: 
    - migrations: 
        0: rate
- name: m_SY
  lower_bound: 1e-8
  upper_bound: 1e-2
  values: 
    - migrations: 
        1: rate

- name: p_StemY
  lower_bound: 1e-4
  upper_bound: 0.95
  values: 
    - demes: 
        Yoruba1:
          proportions: 0

- name: p_StemS
  lower_bound: 1e-4
  upper_bound: 0.95
  values: 
    - demes: 
        Stuttgart:
          proportions: 0
          
constraints: 
- params: [T_Stem, T_NDMH]
  constraint: greater_than
- params: [T_NDMH, T_D]
  constraint: greater_than
