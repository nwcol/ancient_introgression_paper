parameters: 
## Time parameters

- name: T_NDMH
  lower_bound: 4e5
  upper_bound: 1e6
  values: 
    - demes: 
        Anc: 
          epochs: 
            0: end_time
        ND: start_time

- name: T_ND 
  description: Divergence time of Neanderthal and Denisova lineages
  lower_bound: 4e5
  upper_bound: 1e6
  values: 
    - demes: 
        ND: 
          epochs: 
            0: end_time 
        Sup: 
          epochs: 
            0: end_time
        Denisova: start_time

- name: T_MH_N
  description: Time of human to Neanderthal pulse
  upper_bound: 4e5
  lower_bound: 1.15e5
  values: 
    - pulses: 
        0: time

- name: T_AWN
  lower_bound: 1.15e5
  upper_bound: 2.5e5
  values: 
    - demes: 
        N: 
          epochs: 
            0: end_time 
        NW: start_time

- name: T_CV
  lower_bound: 5.5e4
  values: 
    - demes: 
        NW: 
          epochs: 
            0: end_time 

- name: T_OOA 
  description: Divergence time of Yoruba and Loschbour/OOA
  lower_bound: 50000
  upper_bound: 1.15e5
  values: 
    - demes: 
        MH: 
          epochs: 
            0: end_time 

- name: T_Bas
  description: Divergence time of Stuttgart/Basal Eurasian and Loschbour demes
  lower_bound: 7000
  values: 
    - demes: 
        Loschbour: 
          epochs: 
            0: end_time 
        Stuttgart: start_time

## Effective size parameters

- name: N_Anc 
  lower_bound: 1e4
  upper_bound: 2e4
  values: 
    - demes: 
        Anc: 
          epochs: 
            0: start_size 

- name: N_ND
  lower_bound: 100
  upper_bound: 1e5
  values: 
    - demes: 
        ND: 
          epochs: 
            0: start_size 

- name: N_Den
  lower_bound: 1e3
  upper_bound: 1e4
  values: 
    - demes: 
        Denisova: 
          epochs: 
            0: start_size 

- name: N_N
  lower_bound: 100
  upper_bound: 1e4
  values: 
    - demes: 
        N: 
          epochs: 
            0: start_size 
        NW: 
          epochs: 
            0: start_size 

- name: N_Chag
  lower_bound: 10
  upper_bound: 1e4
  values: 
    - demes: 
        Chagyrskaya: 
          epochs: 
            0: start_size 

- name: N_Vin
  lower_bound: 10
  upper_bound: 1e4
  values: 
    - demes: 
        Vindija: 
          epochs: 
            0: start_size 

- name: N_Alt
  lower_bound: 10
  upper_bound: 1e4
  values: 
    - demes: 
        Altai: 
          epochs: 
            0: start_size 

- name: N_MH
  lower_bound: 1e4
  upper_bound: 1e5
  values: 
    - demes: 
        MH: 
          epochs: 
            0: start_size 

- name: N_Yor
  lower_bound: 100
  upper_bound: 1e6
  values: 
    - demes: 
        Yoruba1: 
          epochs: 
            0: start_size 

- name: N_OOA
  lower_bound: 100
  upper_bound: 1e4
  values: 
    - demes: 
        Loschbour: 
          epochs: 
            0: start_size 
- name: N_Los
  lower_bound: 100
  upper_bound: 1e4
  values: 
    - demes: 
        Loschbour: 
          epochs: 
            1: start_size 

- name: N_Stu
  lower_bound: 100
  upper_bound: 1e4
  values: 
    - demes: 
        Stuttgart: 
          epochs: 
            0: start_size 

- name: N_Ust
  lower_bound: 10
  upper_bound: 1e4
  values: 
    - demes: 
        UstIshim: 
          epochs: 
            0: start_size 

## Pulse/migration parameters

- name: p_S_ND
  lower_bound: 1e-4
  upper_bound: 0.10
  values: 
    - demes: 
        ND: 
          proportions: 0

- name: p_S_D
  lower_bound: 1e-4
  upper_bound: 0.10
  values: 
    - demes: 
        Denisova: 
          proportions: 0

- name: p_H_N
  lower_bound: 1e-4
  upper_bound: 0.20
  values: 
    - pulses: 
        0: 
          proportions: 0 

- name: p_H_NW
  lower_bound: 1e-4
  upper_bound: 0.10
  values: 
    - demes: 
        NW: 
          proportions: 0

- name: p_N_OOA
  lower_bound: 1e-4
  upper_bound: 0.10
  values: 
    - pulses: 
        1: 
          proportions: 0 

- name: p_L_S
  description: Fraction of Western Eurasian contribution to Stuttgart lineage
  lower_bound: 1e-4
  upper_bound: 0.999
  values: 
    - pulses: 
        2: 
          proportions: 0 

- name: m_ND
  lower_bound: 1e-8
  upper_bound: 1e-2
  values: 
    - migrations: 
        0: rate
        1: rate

- name: m_SL
  lower_bound: 1e-8
  upper_bound: 1e-2
  values: 
    - migrations: 
        2: rate

- name: m_SY
  lower_bound: 1e-8
  upper_bound: 1e-2
  values:
    - migrations: 
        3: rate

- name: m_LY
  lower_bound: 1e-8
  upper_bound: 1e-2
  values: 
    - migrations: 
        4: rate

constraints: 
- params: [T_NDMH, T_ND]
  constraint: greater_than
- params: [T_ND, T_MH_N]
  constraint: greater_than
- params: [T_MH_N, T_AWN]
  constraint: greater_than
- params: [T_AWN, T_CV]
  constraint: greater_than
- params: [T_OOA, T_Bas]
  constraint: greater_than