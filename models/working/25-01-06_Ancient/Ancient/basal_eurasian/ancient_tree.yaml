description: Tree model relating LBK, Loschbour, Ust_Ishim demes with Neandertal->OOA and Basal Eurasian->LBK admixture pulses.
time_units: years
generation_time: 29
demes:
- name: A
  epochs:
  - start_size: 15000
    end_time: 60000
- name: N
  ancestors: [A]
  start_time: 600000
  epochs:
  - start_size: 1000
    end_time: 50000
- name: OOA
  ancestors: [A]
  epochs:
  - start_size: 2000
    end_time: 48000 ## fixed
- name: BE
  description: "Basal Eurasians"
  ancestors: [OOA]
  epochs:
  - start_size: 1000
    end_time: 20000
- name: UstIshim
  ancestors: [BE]
  start_time: 46000 ## fixed
  epochs:
  - start_size: 1000
    end_time: 45000 ## sample time
- name: WE
  description: "West Eurasians"
  ancestors: [OOA]
  epochs:
  - start_size: 2000
    end_time: 25000  
- name: LBK
  ancestors: [WE]
  epochs:
  - start_size: 12000
    end_time: 7000 ## sample time
- name: Loschbour
  ancestors: [WE]
  epochs:
  - start_size: 2000
    end_time: 8000 ## sample time

pulses:
- sources: [N]
  proportions: [0.02]
  time: 50000
  dest: OOA
- sources: [BE]
  proportions: [0.40]
  time: 20000
  dest: LBK