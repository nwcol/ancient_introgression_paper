parameters:
# Time parameters

- name: T_NDH
  upper_bound: 1e6
  lower_bound: 400000
  values: 
    - demes: 
        Anc: 
          epochs: 
            0: end_time

- name: T_ND
  lower_bound: 350000
  values: 
    - demes:
        ND: 
          epochs: 
            0: end_time

- name: T_H_N
  upper_bound: 5e5
  lower_bound: 115000
  values: 
    - pulses:
        0: time 

- name: T_AWN
  upper_bound: 250000
  lower_bound: 115000
  values: 
    - demes: 
        N: 
          epochs: 
            0: end_time
        WN: start_time

- name: T_CV
  lower_bound: 55000
  values: 
    - demes: 
        WN: 
          epochs: 
            0: end_time

# Size parameters

- name: N_Anc
  lower_bound: 1e4
  upper_bound: 2e4
  values: 
    - demes: 
        Anc: 
          epochs: 
            0: start_size

- name: N_H
  lower_bound: 1e4
  upper_bound: 1e6
  values: 
    - demes: 
        Yoruba1: 
          epochs: 
            0: start_size

- name: N_ND
  lower_bound: 100
  upper_bound: 1e5
  values: 
    - demes: 
        ND: 
          epochs: 
            0: start_size

- name: N_Den
  lower_bound: 10
  upper_bound: 1e4
  values: 
    - demes: 
        Denisova: 
          epochs: 
            0: start_size

- name: N_N
  lower_bound: 100
  upper_bound: 1e4
  values: 
    - demes: 
        N: 
          epochs: 
            0: start_size
        WN: 
          epochs: 
            0: start_size

- name: N_Alt
  lower_bound: 10
  upper_bound: 1e4
  values: 
    - demes: 
        Altai: 
          epochs: 
            0: start_size

- name: N_Chag
  lower_bound: 10
  upper_bound: 1e4
  values: 
    - demes: 
        Chagyrskaya: 
          epochs: 
            0: start_size

- name: N_Vin
  lower_bound: 10
  upper_bound: 1e4
  values: 
    - demes: 
        Vindija: 
          epochs: 
            0: start_size

# Pulse proportions and migrations 

- name: p_H_N
  lower_bound: 1e-6
  upper_bound: 0.15
  values: 
    - pulses:
        0:
          proportions: 0

- name: p_H_WN
  lower_bound: 1e-6
  upper_bound: 0.15
  values: 
    - demes: 
        WN: 
          proportions: 0

- name: m_ND
  lower_bound: 1e-8
  upper_bound: 1e-2
  values: 
    - migrations: 
        0: rate   
        1: rate

constraints: 
- params: [T_NDH, T_ND]
  constraint: greater_than
- params: [T_ND, T_H_N]
  constraint: greater_than
- params: [T_H_N, T_AWN]
  constraint: greater_than
- params: [T_AWN, T_CV]
  constraint: greater_than
