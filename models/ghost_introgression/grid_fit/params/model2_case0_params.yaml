# Parameters for models where T_Ghost->Denisova > T_MH->Neanderthal, so that
# the latter is indexed by 1.
parameters:
- name: T_NDH
  upper_bound: 9e5
  values: 
    - demes: 
        Anc: 
          epochs: 
            0: end_time

- name: T_ND
  lower_bound: 5e5
  values: 
    - demes: 
        ND: 
          epochs: 
            0: end_time

- name: T_pHN
  lower_bound: 1.1e5
  values: 
    - pulses: 
        1: time

- name: N_Anc
  lower_bound: 1e4
  upper_bound: 2e4
  values: 
    - demes: 
        Anc: 
          epochs: 
            0: start_size

- name: N_Yor
  lower_bound: 1e4
  upper_bound: 1e6
  values: 
    - demes: 
        Yoruba1: 
          epochs: 
            0: start_size

- name: N_ND
  lower_bound: 100
  upper_bound: 1e5
  values: 
    - demes: 
        ND: 
          epochs: 
            0: start_size

- name: N_Den
  lower_bound: 1e3
  upper_bound: 1e4
  values: 
    - demes: 
        Denisova: 
          epochs: 
            0: start_size

- name: N_Alt
  lower_bound: 100
  upper_bound: 1e4
  values: 
    - demes: 
        Altai: 
          epochs: 
            0: start_size

- name: N_Gho
  lower_bound: 500
  upper_bound: 5e4
  values: 
    - demes: 
        Ghost: 
          epochs: 
            0: start_size

- name: p_HN
  lower_bound: 1e-6
  upper_bound: 0.20
  values: 
    - pulses: 
        1: 
          proportions: 0

constraints: 
- params: [T_NDH, T_ND]
  constraint: greater_than
- params: [T_ND, T_pHN]
  constraint: greater_than