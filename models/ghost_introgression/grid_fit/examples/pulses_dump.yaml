time_units: generations
generation_time: 1
demes:
- name: popA
  epochs:
  - {end_time: 10000.0, start_size: 10000.0}
- name: popX
  ancestors: [popA]
  epochs:
  - {end_time: 0, start_size: 10000.0}
- name: popY
  ancestors: [popA]
  epochs:
  - {end_time: 0, start_size: 10000.0}
pulses:
- sources: [popX]
  dest: popY
  time: 5000.0
  proportions: [0.05]
- sources: [popX]
  dest: popY
  time: 1000.0
  proportions: [0.1]
