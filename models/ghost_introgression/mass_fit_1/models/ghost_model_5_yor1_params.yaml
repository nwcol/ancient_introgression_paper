parameters:
# Time parameters

- name: T_NDMH
  upper_bound: 1e6
  lower_bound: 400000
  values: 
    - demes: 
        ND: start_time
        Anc: 
          epochs: 
            0: end_time

- name: T_ND
  lower_bound: 350000
  values: 
    - demes:
        Denisova: start_time
        ND: 
          epochs: 
            0: end_time
        Sup:
          epochs: 
            0: end_time

- name: T_AWN
  upper_bound: 250000
  lower_bound: 115000
  values: 
    - demes: 
        N: 
          epochs: 
            0: end_time

- name: T_CV
  lower_bound: 55000
  values: 
    - demes: 
        WN: 
          epochs: 
            0: end_time

